# Paste into ~/.hermes/config.yaml under mcp_servers.
# Token: same as LLM Wiki Settings → API + MCP (optional copy in second_brain/.env as LLM_WIKI_API_TOKEN).
# MCP built from sibling nu_llm_wiki (git@github.com:horselord-joe-8053/llm-wiki.git). See docs/SECOND_BRAIN_RUNBOOK.md §8.

mcp_servers:
  llm_wiki:
    command: node
    args:
      - /Users/jjw8053/projects/nu_llm_wiki/mcp-server/dist/src/index.js
    env:
      LLM_WIKI_API_TOKEN: "<from LLM Wiki Settings → API + MCP>"
      # LLM_WIKI_API_BASE_URL: "http://127.0.0.1:19828/api/v1"

  second_brain_fs:
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
      - /Users/jjw8053/projects/second_brain/brain
