# Retail ingest lanes A–D (experimental LLM Wiki projects). Not BRAIN_PROFILE switches.
schema_version: "1.0"
lanes:
  A:
    path: brain/retail
    ingest_kind: pdf_in_app
    raw_rag_enabled: false
  B:
    path: brain/retail-md
    ingest_kind: external_markdown
    raw_rag_enabled: true
    raw_glob: raw/sources/**/*.md
  C:
    path: brain/retail-txt
    ingest_kind: external_text
    raw_rag_enabled: true
    raw_glob: raw/sources/fridge-docs/**/*.txt
  D:
    path: brain/retail-md-learned
    ingest_kind: learned_markdown
    raw_rag_enabled: true
    raw_glob: raw/sources/fridge-docs-split-less/**/*.md
