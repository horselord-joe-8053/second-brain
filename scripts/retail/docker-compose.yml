# Retail PostgreSQL + pgvector (operator / integration — CI uses in-memory CSV path).
services:
  retail_pg:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
      POSTGRES_DB: retail
    ports:
      - "5433:5432"
    volumes:
      - ./schema:/docker-entrypoint-initdb.d:ro
